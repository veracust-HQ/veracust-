name: Veracust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integration/bootstrap]

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veracust-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: veracust-dashboard/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  engine:
    name: Python engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veracust-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: veracust-engine/requirements.txt
      - name: Install CPU PyTorch and engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q tests
